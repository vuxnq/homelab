name: caddy

services:
  caddy:
    build: ./config
    image: caddy-porkbun
    container_name: caddy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./config:/etc/caddy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env.secret
