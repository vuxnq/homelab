name: syncthing

services:
  syncthing:
    container_name: syncthing
    image: syncthing/syncthing
    restart: unless-stopped
    volumes:
      - ./data:/var/syncthing/config
      - /mnt/sync:/var/syncthing
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    hostname: sheol
