name: caddy

services:
  caddy:
    build: ./config
    container_name: caddy
    restart: unless-stopped
    expose:
      - 8443
    networks: [proxy, share]
    ports:
      - ${BIND_IP}:80:80
      - ${BIND_IP}:443:443
      - ${BIND_IP}:443:443/udp
    volumes:
      - ./config:/etc/caddy
      - /mnt/data/caddy/data:/data
      - /mnt/data/caddy/config:/config
    environment:
      PORKBUN_API_KEY: ${PORKBUN_API_KEY}
      PORKBUN_API_SECRET_KEY: ${PORKBUN_API_SECRET_KEY}
      ACME_EMAIL: ${ACME_EMAIL}
      PIHOLE_IP: ${PIHOLE_IP}

networks:
  proxy:
    external: true
  share:
    external: true
