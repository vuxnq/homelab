# https://immich.app/docs/install/docker-compose

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    restart: always
    expose:
      - 2283
    networks: [default, proxy]
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /mnt/data/immich/data:/data
      - ./immich.json:/data/immich.json
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Europe/Prague
      IMMICH_CONFIG_FILE: /data/immich.json
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    restart: always
    volumes:
      - /mnt/data/immich/ml/cache:/cache
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    restart: always
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: always
    volumes:
      - /mnt/data/immich/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: 'HDD'
    shm_size: 128mb
    healthcheck:
      disable: false

networks:
  proxy:
    external: true
