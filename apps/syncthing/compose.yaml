name: syncthing

services:
  syncthing:
    container_name: syncthing
    hostname: tux
    image: syncthing/syncthing
    restart: unless-stopped
    expose:
      - 8384
    networks: [proxy]
    ports:
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    volumes:
      - /mnt/data/syncthing/config:/var/syncthing/config
      - /mnt/data/syncthing:/var/syncthing
    environment:
      PUID: 1000
      PGID: 1000

networks:
  proxy:
    external: true
