name: syncthing

services:
  syncthing:
    container_name: syncthing
    image: syncthing/syncthing
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - /mnt/data/syncthing/data:/var/syncthing/config
      - /mnt/data/syncthing/sync:/var/syncthing
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    hostname: sheol
