storage:
  type: sqlite
  path: /data/gatus.db

alerting:
  discord:
    webhook-url: "${DISCORD_WEBHOOK_URL}"
    default-alert:
      failure-threshold: 2
      success-threshold: 2
      send-on-resolved: true

external-endpoints:
  - name: apps-host-backup
    group: backup
    token: "${BACKUP_ENDPOINT_TOKEN}"
    heartbeat-interval: 25h
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 1

endpoints:
  - name: caddy-cert
    url: "https://tux.vuxnq.me"
    interval: 1h
    conditions:
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: discord

  - name: dufs
    url: "http://dufs:5000"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: home-assistant
    url: "http://homeassistant:8123"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: immich
    url: "http://immich_server:2283"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: mpd-tcp
    url: "tcp://mpd:6600"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord

  - name: pihole-dns
    url: "${PIHOLE_IP}:53"
    interval: 5m
    dns:
      query-name: "google.com"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"
    alerts:
      - type: discord

  - name: syncthing
    url: "http://syncthing:8384"
    interval: 2m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: ts-share-caddy-tcp
    url: "tcp://caddy:8443"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord
