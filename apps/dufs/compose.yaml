name: dufs

services:
  dufs:
    image: sigoden/dufs:latest
    container_name: dufs
    user: 1000:1000
    ports: 
      - 5000:5000
    volumes:
      - /mnt/data/dufs/shared:/data/shared
      - /mnt/data/syncthing:/data/syncthing
    command: /data -A -a ${DUFS_USER}:${DUFS_PASSWORD}@/syncthing:rw -a @/shared:rw
    restart: unless-stopped
