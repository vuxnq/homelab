name: ts_share

services:
  ts_share:
    image: tailscale/tailscale:latest
    container_name: ts_share
    hostname: share
    restart: unless-stopped
    networks: [share]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - /mnt/data/ts_share/state:/var/lib/tailscale
      - ./config:/config:ro

networks:
  share:
    external: true
