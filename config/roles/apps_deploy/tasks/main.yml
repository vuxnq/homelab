---

- name: ensure rsync is present
  ansible.builtin.apt:
    name: rsync
    state: present

- name: sync apps directory to host
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../apps/"
    dest: "{{ apps_dir }}/"
    delete: true
    use_ssh_args: true
    rsync_opts:
      - "--exclude=.git"
  notify: reload caddy

# dict2items turns app_secrets into a list of {key: "caddy", value: {PORKBUN_API_KEY: ..., ...}} pairs
- name: write .env files for apps that need secrets
  ansible.builtin.copy:
    dest: "{{ apps_dir }}/{{ item.key }}/.env"
    content: |
      {% for k, v in item.value.items() %}
      {{ k }}={{ v }}
      {% endfor %}
    mode: "0600"
  loop: "{{ app_secrets | dict2items }}"
  no_log: true

# apps[].dirs[] -> (app, dir) pairs
- name: ensure app directories exist
  ansible.builtin.file:
    path: "{{ item.1.path }}"
    state: directory
    owner: "{{ item.1.owner | default('1000') }}"
    group: "{{ item.1.group | default('1000') }}"
    mode: "{{ item.1.mode | default('0755') }}"
  loop: "{{ apps | subelements('dirs', skip_missing=True) }}"

- name: deploy each compose project
  community.docker.docker_compose_v2:
    project_src: "{{ apps_dir }}/{{ item.name }}"
    state: present
  loop: "{{ apps }}"
  tags: [apps_start]
