---

- name: ensure rsync is present
  ansible.builtin.apt:
    name: rsync
    state: present

- name: sync apps directory to host
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../apps/"
    dest: "{{ apps_dir }}/"
    delete: true
    use_ssh_args: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=.env"
  notify: reload caddy

- name: write .env files
  ansible.builtin.copy:
    dest: "{{ apps_dir }}/{{ item.name }}/.env"
    content: |
      {% for k, v in ( app_common_env | combine(app_secrets.get(item.name, {})) ).items() %}
      {{ k }}={{ v }}
      {% endfor %}
    mode: "0600"
  loop: "{{ apps }}"
  no_log: true

# apps[].dirs[] -> (app, dir) pairs
- name: ensure app directories exist
  ansible.builtin.file:
    path: "{{ item.1.path }}"
    state: directory
    owner: "{{ item.1.owner | default('1000') }}"
    group: "{{ item.1.group | default('1000') }}"
    mode: "{{ item.1.mode | default('0755') }}"
  loop: "{{ apps | subelements('dirs', skip_missing=True) }}"

- name: create shared network
  community.docker.docker_network:
    name: proxy

- name: deploy each compose project
  community.docker.docker_compose_v2:
    project_src: "{{ apps_dir }}/{{ item.name }}"
    state: present
  loop: "{{ apps }}"
  tags: [apps_start]
