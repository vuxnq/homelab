---

- name: sync apps directory to host
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../apps/"
    dest: "{{ apps_dir }}/"
    delete: true
    use_ssh_args: true
    rsync_opts:
      - "--exclude=.git"

# dict2items turns app_secrets into a list of {key: "caddy", value: {PORKBUN_API_KEY: ..., ...}} pairs
- name: write .env files for apps that need secrets
  ansible.builtin.copy:
    dest: "{{ apps_dir }}/{{ item.key }}/.env"
    content: |
      {% for k, v in item.value.items() %}
      {{ k }}={{ v }}
      {% endfor %}
    mode: "0600"
  loop: "{{ app_secrets | dict2items }}"
  no_log: true

- name: ensure app data directories exist with correct ownership
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ apps_data_dirs }}"

- name: deploy each compose project
  community.docker.docker_compose_v2:
    project_src: "{{ apps_dir }}/{{ item }}"
    state: present
  loop: "{{ apps_services }}"
