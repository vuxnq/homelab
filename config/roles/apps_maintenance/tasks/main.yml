---

- name: deploy apps maintenance script
  ansible.builtin.template:
    src: apps-maintenance.sh.j2
    dest: /usr/local/bin/apps-maintenance.sh
    mode: "0755"

- name: deploy systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - apps-maintenance.service
    - apps-maintenance.timer
  notify: reload systemd

- name: enable apps maintenance timer
  ansible.builtin.systemd:
    name: apps-maintenance.timer
    enabled: true
    state: started
    daemon_reload: true
