---

- name: deploy docker maintenance script
  ansible.builtin.template:
    src: docker-maintenance.sh.j2
    dest: /usr/local/bin/docker-maintenance.sh
    mode: "0755"

- name: deploy systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - docker-maintenance.service
    - docker-maintenance.timer
  notify: reload systemd

- name: enable docker maintenance timer
  ansible.builtin.systemd:
    name: docker-maintenance.timer
    enabled: true
    state: started
    daemon_reload: true
