---

- name: ensure sqlite3 is present
  ansible.builtin.apt:
    name: sqlite3
    state: present

- name: create pihole group
  ansible.builtin.group:
    name: pihole
    system: true
    state: present

- name: create pihole user
  ansible.builtin.user:
    name: pihole
    group: pihole
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: ensure pihole config dir exists
  ansible.builtin.file:
    path: /etc/pihole
    state: directory
    owner: pihole
    group: pihole
    mode: "0755"

- name: pre-seed pihole config
  ansible.builtin.template:
    src: pihole.toml.j2
    dest: /etc/pihole/pihole.toml
    owner: pihole
    group: pihole
    mode: "0644"

- name: run pihole unattended installer
  ansible.builtin.shell:
    cmd: curl -L https://install.pi-hole.net | bash /dev/stdin --unattended
    creates: /etc/systemd/system/pihole-FTL.service

- name: ensure pihole-FTL is enabled and running
  ansible.builtin.systemd:
    name: pihole-FTL
    enabled: true
    state: started

- name: create systemd override dir for pihole-FTL
  ansible.builtin.file:
    path: /etc/systemd/system/pihole-FTL.service.d
    state: directory
    mode: "0755"

- name: write pihole-FTL password env file
  ansible.builtin.copy:
    dest: /etc/pihole/webserver-api-password.env
    content: "FTLCONF_webserver_api_password={{ pihole_password }}\n"
    mode: "0600"
  notify: restart pihole-FTL

- name: deploy systemd override for pihole-FTL
  ansible.builtin.copy:
    dest: /etc/systemd/system/pihole-FTL.service.d/override.conf
    content: |
      [Service]
      EnvironmentFile=/etc/pihole/webserver-api-password.env
    mode: "0644"
  notify: restart pihole-FTL

- name: get current adlist URLs from gravity.db
  ansible.builtin.command: sqlite3 /etc/pihole/gravity.db "SELECT address FROM adlist;"
  register: current_adlist
  changed_when: false

- name: determine adlist changes
  ansible.builtin.set_fact:
    adlist_to_add: "{{ adlist_urls | difference(current_adlist.stdout_lines) }}"
    adlist_to_remove: "{{ current_adlist.stdout_lines | difference(adlist_urls) }}"

- name: add new adlist URLs
  ansible.builtin.command: >
    sqlite3 /etc/pihole/gravity.db
    "INSERT INTO adlist (address, enabled) VALUES ('{{ item }}', 1);"
  loop: "{{ adlist_to_add }}"
  notify: update gravity

- name: remove stale adlist URLs
  ansible.builtin.command: >
    sqlite3 /etc/pihole/gravity.db
    "DELETE FROM adlist WHERE address='{{ item }}';"
  loop: "{{ adlist_to_remove }}"
  notify: update gravity
