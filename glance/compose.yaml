name: glance

services:
  glance:
    container_name: glance
    image: glanceapp/glance
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 8080:8080
    environment:
      LASTFM_USERNAME: vuxnq
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
