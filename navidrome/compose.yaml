name: navidrome

services:
  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
    ports:
      - 4533:4533
    restart: unless-stopped
    volumes:
      - ./data:/data
      - /mnt/music:/music:ro
    environment:
      - ND_DEFAULTUIVOLUME=25
      - ND_DEFAULTTHEME="Spotify-ish"
      - ND_SUBSONIC_ARTISTPARTICIPATIONS=true
    env_file:
      - .env.secret
